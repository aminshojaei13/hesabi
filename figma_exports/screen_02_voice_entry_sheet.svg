<svg width="393" height="852" viewBox="0 0 393 852" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="393" y2="852" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0E17"/>
      <stop offset="100%" stop-color="#0F1422"/>
    </linearGradient>

    <linearGradient id="neonPurplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="neonCyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dimmed Main Screen Background -->
  <rect width="393" height="852" fill="url(#bgGrad)"/>
  <rect width="393" height="852" fill="#000000" fill-opacity="0.65"/>

  <!-- Voice Entry Modal Bottom Sheet -->
  <g id="VoiceBottomSheet" transform="translate(0, 240)">
    <!-- Sheet Container -->
    <path d="M 0 36 C 0 16 16 0 36 0 L 357 0 C 377 0 393 16 393 36 L 393 612 L 0 612 Z" fill="#111827" stroke="#374151" stroke-width="1"/>
    
    <!-- Drag Handle -->
    <rect x="176" y="14" width="40" height="4" rx="2" fill="#4B5563"/>

    <!-- Header -->
    <text x="353" y="60" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="18" font-weight="800" text-anchor="end">ثبت هوشمند با صوت</text>
    <text x="353" y="82" fill="#9CA3AF" font-family="Vazirmatn, sans-serif" font-size="12" text-anchor="end">در حال گوش دادن... لطفاً هزینه را بگویید</text>
    
    <!-- Close Button -->
    <circle cx="40" cy="65" r="16" fill="#1F2937"/>
    <text x="40" y="70" fill="#9CA3AF" font-family="Vazirmatn, sans-serif" font-size="14" text-anchor="middle">✕</text>

    <!-- Waveform Visualizer Center -->
    <g id="WaveformBars" transform="translate(60, 120)" filter="url(#waveGlow)">
      <!-- Pulsing bars simulating real voice frequency -->
      <rect x="0" y="30" width="5" height="24" rx="2.5" fill="#8B5CF6"/>
      <rect x="12" y="20" width="5" height="44" rx="2.5" fill="#A855F7"/>
      <rect x="24" y="10" width="5" height="64" rx="2.5" fill="#EC4899"/>
      <rect x="36" y="25" width="5" height="34" rx="2.5" fill="#8B5CF6"/>
      <rect x="48" y="5" width="5" height="74" rx="2.5" fill="#00F2FE"/>
      <rect x="60" y="18" width="5" height="48" rx="2.5" fill="#10B981"/>
      <rect x="72" y="2" width="5" height="80" rx="2.5" fill="#00F2FE"/>
      <rect x="84" y="24" width="5" height="36" rx="2.5" fill="#A855F7"/>
      <rect x="96" y="0" width="5" height="84" rx="2.5" fill="#EC4899"/>
      <rect x="108" y="15" width="5" height="54" rx="2.5" fill="#00F2FE"/>
      <rect x="120" y="2" width="5" height="80" rx="2.5" fill="#10B981"/>
      <rect x="132" y="22" width="5" height="40" rx="2.5" fill="#8B5CF6"/>
      <rect x="144" y="8" width="5" height="68" rx="2.5" fill="#00F2FE"/>
      <rect x="156" y="26" width="5" height="32" rx="2.5" fill="#A855F7"/>
      <rect x="168" y="4" width="5" height="76" rx="2.5" fill="#EC4899"/>
      <rect x="180" y="18" width="5" height="48" rx="2.5" fill="#10B981"/>
      <rect x="192" y="10" width="5" height="64" rx="2.5" fill="#00F2FE"/>
      <rect x="204" y="24" width="5" height="36" rx="2.5" fill="#8B5CF6"/>
      <rect x="216" y="5" width="5" height="74" rx="2.5" fill="#EC4899"/>
      <rect x="228" y="22" width="5" height="40" rx="2.5" fill="#10B981"/>
      <rect x="240" y="15" width="5" height="54" rx="2.5" fill="#00F2FE"/>
      <rect x="252" y="28" width="5" height="28" rx="2.5" fill="#8B5CF6"/>
      <rect x="264" y="32" width="5" height="20" rx="2.5" fill="#A855F7"/>
    </g>

    <!-- Pulsing Central Microphone Orb -->
    <g id="GlowingMicOrb" transform="translate(196, 260)">
      <circle cx="0" cy="0" r="48" fill="#8B5CF6" fill-opacity="0.15" filter="url(#neonGlow)"/>
      <circle cx="0" cy="0" r="38" fill="url(#neonPurplePink)" filter="url(#neonGlow)"/>
      <text x="0" y="8" font-size="28" text-anchor="middle">🎙️</text>
    </g>

    <!-- Real-time Speech Transcript Card -->
    <g id="TranscriptBox" transform="translate(24, 326)">
      <rect width="345" height="64" rx="16" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
      <text x="325" y="28" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="11" text-anchor="end">رونوشت زنده گفتار:</text>
      <text x="325" y="49" fill="#F8FAFC" font-family="Vazirmatn, sans-serif" font-size="14" font-weight="700" text-anchor="end">«پنجاه هزار تومن بنزین با کارت ملت»</text>
    </g>

    <!-- Extracted AI Entities Chips -->
    <g id="ExtractedChips" transform="translate(24, 404)">
      <text x="345" y="16" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="11" text-anchor="end">شناسایی هوشمند فیلدها:</text>

      <!-- Amount Chip -->
      <rect x="235" y="28" width="110" height="34" rx="10" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
      <text x="290" y="50" fill="#34D399" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="700" text-anchor="middle">💰 ۵۰,۰۰۰ تومان</text>

      <!-- Category Chip -->
      <rect x="110" y="28" width="115" height="34" rx="10" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="1"/>
      <text x="167" y="50" fill="#C4B5FD" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⛽ سوخت و بنزین</text>

      <!-- Account Chip -->
      <rect x="0" y="28" width="100" height="34" rx="10" fill="#00F2FE" fill-opacity="0.15" stroke="#00F2FE" stroke-width="1"/>
      <text x="50" y="50" fill="#38BDF8" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="700" text-anchor="middle">💳 بانک ملت</text>
    </g>

    <!-- Confirm & Submit Action Button -->
    <g id="ConfirmButton" transform="translate(24, 490)">
      <rect width="345" height="56" rx="18" fill="url(#neonCyanEmerald)" filter="url(#neonGlow)"/>
      <text x="172" y="34" fill="#0B0E17" font-family="Vazirmatn, sans-serif" font-size="15" font-weight="900" text-anchor="middle">✓ تأیید و ثبت فوری در حساب</text>
    </g>
  </g>
</svg>
