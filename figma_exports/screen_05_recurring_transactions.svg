<svg width="393" height="852" viewBox="0 0 393 852" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="393" y2="852" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0E17"/>
      <stop offset="100%" stop-color="#0F1422"/>
    </linearGradient>

    <linearGradient id="neonCyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="glassCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2234" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#121826" stop-opacity="0.65"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="393" height="852" fill="url(#bgGrad)"/>

  <!-- Top App Bar -->
  <g id="TopBar" transform="translate(20, 50)">
    <circle cx="20" cy="20" r="18" fill="#1E293B"/>
    <text x="20" y="24" fill="#94A3B8" font-size="14" text-anchor="middle">←</text>
    <text x="353" y="18" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="12" text-anchor="end">برنامه‌ریزی مالی منظم</text>
    <text x="353" y="38" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="18" font-weight="800" text-anchor="end">تراکنش‌های دوره‌ای و ثابت</text>
  </g>

  <!-- Total Monthly Commitments Header Card -->
  <g id="CommitmentsHeaderCard" transform="translate(20, 110)">
    <rect width="353" height="100" rx="20" fill="url(#glassCardGrad)" stroke="#334155" stroke-width="1"/>

    <text x="329" y="36" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="12" text-anchor="end">تعهدات پرداختی ماهانه</text>
    <text x="329" y="72" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="26" font-weight="900" text-anchor="end">۱۹,۱۸۰,۰۰۰ <tspan font-size="13" fill="#00F2FE">تومان</tspan></text>

    <!-- Active Count Pill -->
    <rect x="24" y="34" width="105" height="32" rx="10" fill="#00F2FE" fill-opacity="0.12"/>
    <text x="76" y="54" fill="#38BDF8" font-family="Vazirmatn, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🔄 ۴ مورد فعال</text>
  </g>

  <!-- Due Transaction Alert Banner -->
  <g id="DueAlertBanner" transform="translate(20, 225)">
    <rect width="353" height="54" rx="16" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="1"/>
    <circle cx="325" cy="27" r="12" fill="#8B5CF6"/>
    <text x="325" y="32" fill="#FFFFFF" font-size="12" text-anchor="middle">🔔</text>
    
    <text x="302" y="27" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="12" font-weight="700" text-anchor="end">اشتراک فیلیمو موعد امروز است</text>
    <text x="302" y="42" fill="#C4B5FD" font-family="Vazirmatn, sans-serif" font-size="10" text-anchor="end">۱۸۰,۰۰۰ تومان • ثبت خودکار فعال</text>

    <rect x="20" y="13" width="75" height="28" rx="8" fill="#8B5CF6"/>
    <text x="57" y="31" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="800" text-anchor="middle">ثبت موعد</text>
  </g>

  <!-- Recurring Transactions List -->
  <g id="RecurringList" transform="translate(20, 295)">
    <!-- Item 1: House Rent -->
    <g transform="translate(0, 0)">
      <rect width="353" height="116" rx="20" fill="url(#glassCardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="329" y="34" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="15" font-weight="800" text-anchor="end">اجاره آپارتمان</text>
      
      <!-- Frequency Badge -->
      <rect x="180" y="18" width="55" height="22" rx="6" fill="#1E293B"/>
      <text x="207" y="33" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="10" text-anchor="middle">ماهانه</text>

      <!-- Auto Badge -->
      <rect x="120" y="18" width="55" height="22" rx="6" fill="#10B981" fill-opacity="0.15"/>
      <text x="147" y="33" fill="#10B981" font-family="Vazirmatn, sans-serif" font-size="10" font-weight="700" text-anchor="middle">خودکار</text>

      <!-- Amount -->
      <text x="24" y="34" fill="#F43F5E" font-family="Vazirmatn, sans-serif" font-size="16" font-weight="900">-۱۵,۰۰۰,۰۰۰ <tspan font-size="10">تومان</tspan></text>

      <text x="329" y="60" fill="#64748B" font-family="Vazirmatn, sans-serif" font-size="11" text-anchor="end">کارت ملت • مسکن و ساختمان</text>

      <line x1="24" y1="74" x2="329" y2="74" stroke="#334155" stroke-opacity="0.3"/>

      <!-- Footer: Next Due Date + Switch -->
      <text x="329" y="98" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="11" text-anchor="end">موعد بعدی: شنبه ۱ آذر</text>

      <!-- Toggle Switch Active -->
      <g transform="translate(24, 84)">
        <rect width="38" height="20" rx="10" fill="#10B981"/>
        <circle cx="28" cy="10" r="7" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Item 2: Salary -->
    <g transform="translate(0, 130)">
      <rect width="353" height="116" rx="20" fill="url(#glassCardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="329" y="34" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="15" font-weight="800" text-anchor="end">حقوق ماهانه شرکت</text>
      
      <!-- Frequency Badge -->
      <rect x="180" y="18" width="55" height="22" rx="6" fill="#1E293B"/>
      <text x="207" y="33" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="10" text-anchor="middle">ماهانه</text>

      <!-- Amount -->
      <text x="24" y="34" fill="#10B981" font-family="Vazirmatn, sans-serif" font-size="16" font-weight="900">+۳۵,۰۰۰,۰۰۰ <tspan font-size="10">تومان</tspan></text>

      <text x="329" y="60" fill="#64748B" font-family="Vazirmatn, sans-serif" font-size="11" text-anchor="end">بلوبانک • حقوق و دستمزد</text>

      <line x1="24" y1="74" x2="329" y2="74" stroke="#334155" stroke-opacity="0.3"/>

      <text x="329" y="98" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="11" text-anchor="end">موعد بعدی: دوشنبه ۲۵ آبان</text>

      <!-- Toggle Switch Active -->
      <g transform="translate(24, 84)">
        <rect width="38" height="20" rx="10" fill="#10B981"/>
        <circle cx="28" cy="10" r="7" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Item 3: Filimo Subscription -->
    <g transform="translate(0, 260)">
      <rect width="353" height="116" rx="20" fill="url(#glassCardGrad)" stroke="#334155" stroke-width="1"/>
      <text x="329" y="34" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="15" font-weight="800" text-anchor="end">اشتراک فیلیمو</text>
      
      <rect x="180" y="18" width="55" height="22" rx="6" fill="#1E293B"/>
      <text x="207" y="33" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="10" text-anchor="middle">ماهانه</text>

      <rect x="120" y="18" width="55" height="22" rx="6" fill="#10B981" fill-opacity="0.15"/>
      <text x="147" y="33" fill="#10B981" font-family="Vazirmatn, sans-serif" font-size="10" font-weight="700" text-anchor="middle">خودکار</text>

      <text x="24" y="34" fill="#F43F5E" font-family="Vazirmatn, sans-serif" font-size="16" font-weight="900">-۱۸۰,۰۰۰ <tspan font-size="10">تومان</tspan></text>

      <text x="329" y="60" fill="#64748B" font-family="Vazirmatn, sans-serif" font-size="11" text-anchor="end">کارت سامان • سرگرمی و اشتراک</text>

      <line x1="24" y1="74" x2="329" y2="74" stroke="#334155" stroke-opacity="0.3"/>

      <text x="329" y="98" fill="#F59E0B" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="700" text-anchor="end">سررسید: امروز (آماده اعمال)</text>

      <!-- Toggle Switch Active -->
      <g transform="translate(24, 84)">
        <rect width="38" height="20" rx="10" fill="#10B981"/>
        <circle cx="28" cy="10" r="7" fill="#FFFFFF"/>
      </g>
    </g>
  </g>

  <!-- Floating Action Button (+) -->
  <g id="FAB" transform="translate(305, 750)" filter="url(#neonGlow)">
    <circle cx="28" cy="28" r="28" fill="url(#neonCyanEmerald)"/>
    <text x="28" y="36" fill="#0B0E17" font-size="28" font-weight="800" text-anchor="middle">+</text>
  </g>
</svg>
