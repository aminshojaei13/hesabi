<svg width="393" height="852" viewBox="0 0 393 852" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="393" y2="852" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0E17"/>
      <stop offset="50%" stop-color="#0F1422"/>
      <stop offset="100%" stop-color="#0B0E17"/>
    </linearGradient>

    <!-- Cyan to Emerald Lumina Neon Gradient -->
    <linearGradient id="neonCyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Purple to Indigo Gradient -->
    <linearGradient id="neonPurpleIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="glassCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2234" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#121826" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="393" height="852" fill="url(#bgGrad)"/>

  <!-- Top Status Bar Mock -->
  <g id="StatusBar" opacity="0.8">
    <text x="350" y="32" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="13" font-weight="600" text-anchor="end">۹:۴۱</text>
    <circle cx="48" cy="28" r="4" fill="#10B981"/>
    <rect x="58" y="24" width="18" height="8" rx="2" stroke="#FFFFFF" stroke-width="1.2" fill="none"/>
    <rect x="60" y="26" width="11" height="4" rx="1" fill="#FFFFFF"/>
  </g>

  <!-- Top App Bar -->
  <g id="TopBar" transform="translate(20, 50)">
    <circle cx="20" cy="20" r="20" fill="#1E2738"/>
    <circle cx="20" cy="20" r="10" fill="url(#neonCyanEmerald)"/>
    <text x="353" y="18" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="12" text-anchor="end">سلام امین عزیز 👋</text>
    <text x="353" y="38" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="18" font-weight="800" text-anchor="end">داشبورد حسابداری</text>
  </g>

  <!-- Hero Total Balance Card -->
  <g id="HeroBalanceCard" transform="translate(20, 115)" filter="url(#softShadow)">
    <rect width="353" height="150" rx="24" fill="url(#glassCardGrad)" stroke="#334155" stroke-width="1" stroke-opacity="0.5"/>
    <!-- Decorative Ambient Light Blur inside card -->
    <circle cx="310" cy="30" r="50" fill="#00F2FE" opacity="0.12" filter="blur(20px)"/>
    <circle cx="40" cy="110" r="40" fill="#10B981" opacity="0.1" filter="blur(20px)"/>

    <text x="329" y="36" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="13" text-anchor="end">موجودی کل دارایی‌ها</text>
    <text x="329" y="80" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="32" font-weight="900" text-anchor="end">۴۸,۵۰۰,۰۰۰ <tspan font-size="15" fill="#00F2FE" font-weight="600">تومان</tspan></text>

    <!-- Mini Income & Expense Row inside hero -->
    <line x1="24" y1="102" x2="329" y2="102" stroke="#334155" stroke-opacity="0.4"/>
    <text x="329" y="130" fill="#10B981" font-family="Vazirmatn, sans-serif" font-size="12" font-weight="700" text-anchor="end">↑ واریزی ماه: ۱۸,۰۰۰,۰۰۰</text>
    <text x="24" y="130" fill="#F43F5E" font-family="Vazirmatn, sans-serif" font-size="12" font-weight="700">↓ مخارج ماه: ۹,۴۵۰,۰۰۰</text>
  </g>

  <!-- Safe to Spend Gauge Widget -->
  <g id="SafeToSpendGauge" transform="translate(20, 280)" filter="url(#softShadow)">
    <rect width="353" height="156" rx="24" fill="url(#glassCardGrad)" stroke="#334155" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Radial Arc Gauge Background -->
    <path d="M 100 120 A 45 45 0 1 1 145 75" fill="none" stroke="#1E293B" stroke-width="8" stroke-linecap="round"/>
    <!-- Radial Arc Gauge Active (68%) -->
    <path d="M 100 120 A 45 45 0 1 1 142 60" fill="none" stroke="url(#neonCyanEmerald)" stroke-width="8" stroke-linecap="round" filter="url(#neonGlow)"/>
    
    <text x="100" y="80" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="16" font-weight="800" text-anchor="middle">۶۸٪</text>
    <text x="100" y="96" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="10" text-anchor="middle">مصرف بودجه</text>

    <!-- Gauge Info on the Right (RTL) -->
    <text x="329" y="42" fill="#00F2FE" font-family="Vazirmatn, sans-serif" font-size="12" font-weight="700" text-anchor="end">خرج امن امروز (Safe-to-Spend)</text>
    <text x="329" y="74" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="22" font-weight="900" text-anchor="end">۴۸۰,۰۰۰ <tspan font-size="13" fill="#94A3B8">تومان</tspan></text>
    
    <rect x="210" y="94" width="119" height="26" rx="8" fill="#10B981" fill-opacity="0.15"/>
    <text x="320" y="111" fill="#10B981" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="700" text-anchor="end">۱۲ روز مانده تا حقوق بعدی</text>
  </g>

  <!-- Quick Action Buttons -->
  <g id="QuickActions" transform="translate(20, 452)">
    <!-- Action 1: Voice Entry Pill -->
    <rect x="245" y="0" width="108" height="44" rx="14" fill="#8B5CF6" fill-opacity="0.18" stroke="#8B5CF6" stroke-width="1"/>
    <text x="285" y="27" fill="#C4B5FD" font-family="Vazirmatn, sans-serif" font-size="12" font-weight="700">ثبت با صوت 🎙️</text>

    <!-- Action 2: Transfer -->
    <rect x="126" y="0" width="108" height="44" rx="14" fill="#1E2738" stroke="#334155" stroke-width="1"/>
    <text x="160" y="27" fill="#E2E8F0" font-family="Vazirmatn, sans-serif" font-size="12" font-weight="600">انتقال کارت 💳</text>

    <!-- Action 3: Debts -->
    <rect x="7" y="0" width="108" height="44" rx="14" fill="#1E2738" stroke="#334155" stroke-width="1"/>
    <text x="35" y="27" fill="#E2E8F0" font-family="Vazirmatn, sans-serif" font-size="12" font-weight="600">چک و اقساط 📄</text>
  </g>

  <!-- Recent Transactions Section -->
  <g id="RecentTransactions" transform="translate(20, 514)">
    <text x="353" y="16" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="15" font-weight="800" text-anchor="end">تراکنش‌های اخیر</text>
    <text x="0" y="16" fill="#00F2FE" font-family="Vazirmatn, sans-serif" font-size="12" font-weight="600">مشاهده همه</text>

    <!-- Transaction Item 1 -->
    <g transform="translate(0, 32)">
      <rect width="353" height="66" rx="16" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
      <circle cx="320" cy="33" r="18" fill="#F43F5E" fill-opacity="0.15"/>
      <text x="320" y="38" font-size="16" text-anchor="middle">⛽</text>
      <text x="290" y="29" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="13" font-weight="700" text-anchor="end">بنزین و سوخت</text>
      <text x="290" y="47" fill="#64748B" font-family="Vazirmatn, sans-serif" font-size="11" text-anchor="end">کارت ملت • امروز ۱۴:۲۰ (ثبت با صوت)</text>
      <text x="20" y="38" fill="#F43F5E" font-family="Vazirmatn, sans-serif" font-size="14" font-weight="800">-۶۵,۰۰۰ <tspan font-size="10">تومان</tspan></text>
    </g>

    <!-- Transaction Item 2 -->
    <g transform="translate(0, 108)">
      <rect width="353" height="66" rx="16" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
      <circle cx="320" cy="33" r="18" fill="#10B981" fill-opacity="0.15"/>
      <text x="320" y="38" font-size="16" text-anchor="middle">💼</text>
      <text x="290" y="29" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="13" font-weight="700" text-anchor="end">حقوق و دستمزد</text>
      <text x="290" y="47" fill="#64748B" font-family="Vazirmatn, sans-serif" font-size="11" text-anchor="end">بلوبانک • دیروز</text>
      <text x="20" y="38" fill="#10B981" font-family="Vazirmatn, sans-serif" font-size="14" font-weight="800">+۲۲,۰۰۰,۰۰۰ <tspan font-size="10">تومان</tspan></text>
    </g>

    <!-- Transaction Item 3 -->
    <g transform="translate(0, 184)">
      <rect width="353" height="66" rx="16" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
      <circle cx="320" cy="33" r="18" fill="#3B82F6" fill-opacity="0.15"/>
      <text x="320" y="38" font-size="16" text-anchor="middle">🛒</text>
      <text x="290" y="29" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="13" font-weight="700" text-anchor="end">سوپرمارکت و میوه</text>
      <text x="290" y="47" fill="#64748B" font-family="Vazirmatn, sans-serif" font-size="11" text-anchor="end">کارت سامان • ۲ روز پیش</text>
      <text x="20" y="38" fill="#F43F5E" font-family="Vazirmatn, sans-serif" font-size="14" font-weight="800">-۳۴۰,۰۰۰ <tspan font-size="10">تومان</tspan></text>
    </g>
  </g>

  <!-- Dual Floating Dock Navigation -->
  <g id="FloatingDock" transform="translate(24, 764)" filter="url(#softShadow)">
    <rect width="345" height="64" rx="32" fill="#111827" fill-opacity="0.95" stroke="#374151" stroke-width="1"/>

    <!-- Tab 1: Home (Active) -->
    <circle cx="45" cy="32" r="18" fill="#00F2FE" fill-opacity="0.15"/>
    <text x="45" y="36" font-size="16" text-anchor="middle">🏠</text>

    <!-- Tab 2: Transactions -->
    <text x="105" y="36" font-size="16" text-anchor="middle">📊</text>

    <!-- Central Dual Floating Action: Voice Mic + Quick Add -->
    <g transform="translate(142, 6)">
      <!-- Voice Mic Neon Button -->
      <circle cx="26" cy="26" r="23" fill="url(#neonPurpleIndigo)" filter="url(#neonGlow)"/>
      <text x="26" y="32" font-size="17" text-anchor="middle">🎙️</text>

      <!-- Quick Add Button -->
      <circle cx="68" cy="26" r="21" fill="url(#neonCyanEmerald)"/>
      <text x="68" y="33" font-size="20" font-weight="800" fill="#0B0E17" text-anchor="middle">+</text>
    </g>

    <!-- Tab 3: Reports -->
    <text x="245" y="36" font-size="16" text-anchor="middle">📈</text>

    <!-- Tab 4: More -->
    <text x="305" y="36" font-size="16" text-anchor="middle">⚙️</text>
  </g>
</svg>
