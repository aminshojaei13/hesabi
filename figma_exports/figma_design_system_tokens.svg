<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonCyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="neonPurplePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0B0E17"/>

  <!-- Title & Header -->
  <text x="760" y="50" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="24" font-weight="900" text-anchor="end">دیزاین سیستم حسابی — Lumina UI Kit</text>
  <text x="760" y="75" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="13" text-anchor="end">پالت رنگی نئونی، تایپوگرافی، کارت‌های شیشه‌ای و ابعاد استاندارد فیگما</text>

  <!-- Section 1: Color Palette Tokens -->
  <g id="ColorTokens" transform="translate(40, 110)">
    <text x="720" y="0" fill="#00F2FE" font-family="Vazirmatn, sans-serif" font-size="16" font-weight="800" text-anchor="end">پالت رنگ‌های اصلی (Color Tokens)</text>

    <!-- Color 1: Obsidian Base -->
    <g transform="translate(620, 20)">
      <rect width="100" height="70" rx="12" fill="#0B0E17" stroke="#334155" stroke-width="1"/>
      <text x="50" y="100" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">#0B0E17</text>
      <text x="50" y="115" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="10" text-anchor="middle">پس‌زمینه آبسیدین</text>
    </g>

    <!-- Color 2: Glass Surface -->
    <g transform="translate(500, 20)">
      <rect width="100" height="70" rx="12" fill="#141C2E" stroke="#334155" stroke-width="1"/>
      <text x="50" y="100" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">#141C2E</text>
      <text x="50" y="115" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="10" text-anchor="middle">کارت‌های شیشه‌ای</text>
    </g>

    <!-- Color 3: Neon Cyan -->
    <g transform="translate(380, 20)">
      <rect width="100" height="70" rx="12" fill="#00F2FE"/>
      <text x="50" y="100" fill="#00F2FE" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">#00F2FE</text>
      <text x="50" y="115" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="10" text-anchor="middle">فیروزه‌ای نئونی</text>
    </g>

    <!-- Color 4: Emerald Mint -->
    <g transform="translate(260, 20)">
      <rect width="100" height="70" rx="12" fill="#10B981"/>
      <text x="50" y="100" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">#10B981</text>
      <text x="50" y="115" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="10" text-anchor="middle">سبز زمردی (درآمد)</text>
    </g>

    <!-- Color 5: Purple AI -->
    <g transform="translate(140, 20)">
      <rect width="100" height="70" rx="12" fill="#8B5CF6"/>
      <text x="50" y="100" fill="#C4B5FD" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">#8B5CF6</text>
      <text x="50" y="115" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="10" text-anchor="middle">بنفش صوتی و هوش مصنوعی</text>
    </g>

    <!-- Color 6: Rose Expense -->
    <g transform="translate(20, 20)">
      <rect width="100" height="70" rx="12" fill="#F43F5E"/>
      <text x="50" y="100" fill="#F43F5E" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">#F43F5E</text>
      <text x="50" y="115" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="10" text-anchor="middle">قرمز گل سرخ (هزینه)</text>
    </g>
  </g>

  <!-- Section 2: Corner Radii & Geometry Tokens -->
  <g id="RadiiTokens" transform="translate(40, 280)">
    <text x="720" y="0" fill="#00F2FE" font-family="Vazirmatn, sans-serif" font-size="16" font-weight="800" text-anchor="end">شعاع گوشه‌ها (Corner Radii)</text>

    <!-- Radius 12dp: Input -->
    <g transform="translate(560, 25)">
      <rect width="160" height="50" rx="12" fill="#1A2234" stroke="#334155" stroke-width="1"/>
      <text x="80" y="30" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="12" text-anchor="middle">HesabiRadius.input (12dp)</text>
    </g>

    <!-- Radius 20dp: Small Card -->
    <g transform="translate(370, 25)">
      <rect width="160" height="50" rx="20" fill="#1A2234" stroke="#334155" stroke-width="1"/>
      <text x="80" y="30" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="12" text-anchor="middle">HesabiRadius.card (16-20dp)</text>
    </g>

    <!-- Radius 28dp: Large Dock & Hero -->
    <g transform="translate(180, 25)">
      <rect width="160" height="50" rx="28" fill="#1A2234" stroke="#334155" stroke-width="1"/>
      <text x="80" y="30" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="12" text-anchor="middle">HesabiRadius.hero (28-32dp)</text>
    </g>
  </g>

  <!-- Section 3: Official App Icon Vector Element -->
  <g id="OfficialAppIcon" transform="translate(40, 410)">
    <text x="720" y="0" fill="#00F2FE" font-family="Vazirmatn, sans-serif" font-size="16" font-weight="800" text-anchor="end">آیکون رسمی برنامه (The Growth Vector Monogram)</text>
    
    <g transform="translate(590, 20)">
      <rect width="130" height="130" rx="36" fill="#121826" stroke="#334155" stroke-width="1.5"/>
      <circle cx="65" cy="65" r="45" fill="#00F2FE" fill-opacity="0.08"/>
      
      <!-- Monogram -->
      <path d="M 40,55 C 52,50 82,50 92,65 C 98,74 95,84 83,90 C 70,96 52,93 42,102 C 36,108 39,117 54,120 C 72,123 90,114 100,102"
            stroke="url(#neonCyanEmerald)" stroke-width="6.5" stroke-linecap="round" fill="none"/>
      <circle cx="67" cy="73" r="5" fill="#00F2FE"/>
    </g>

    <!-- Typography Specs -->
    <g transform="translate(40, 30)">
      <text x="500" y="25" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="20" font-weight="900" text-anchor="end">وزیرمتن سیاه (Black / 900) — تیترها و مبالغ بزرگ</text>
      <text x="500" y="55" fill="#E2E8F0" font-family="Vazirmatn, sans-serif" font-size="16" font-weight="700" text-anchor="end">وزیرمتن برجسته (Bold / 700) — عناوین تراکنش و دسته‌ها</text>
      <text x="500" y="85" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="13" font-weight="500" text-anchor="end">وزیرمتن متوسط (Medium / 500) — توضیحات، تاریخ‌ها و برچسب‌ها</text>
      <text x="500" y="115" fill="#64748B" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="400" text-anchor="end">وزیرمتن عادی (Regular / 400) — یادداشت‌ها و راهنماها</text>
    </g>
  </g>
</svg>
