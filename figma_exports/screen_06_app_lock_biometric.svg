<svg width="393" height="852" viewBox="0 0 393 852" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="393" y2="852" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0E17"/>
      <stop offset="50%" stop-color="#0F1422"/>
      <stop offset="100%" stop-color="#0B0E17"/>
    </linearGradient>

    <linearGradient id="neonCyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="keypadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2738" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#141C2E" stop-opacity="0.7"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="393" height="852" fill="url(#bgGrad)"/>

  <!-- Brand Logo & Security Header -->
  <g id="LockHeader" transform="translate(196, 110)">
    <!-- Glowing App Icon Badge -->
    <rect x="-42" y="0" width="84" height="84" rx="24" fill="#141C2E" stroke="#334155" stroke-width="1.5" filter="url(#softShadow)"/>
    <circle cx="0" cy="42" r="30" fill="#00F2FE" fill-opacity="0.1" filter="url(#neonGlow)"/>

    <!-- Stylized Monogram Growth Curve in icon -->
    <path d="M -16,36 C -8,32 12,32 18,42 C 22,48 20,54 12,58 C 4,62 -8,60 -14,66 C -18,70 -16,76 -6,78 C 6,80 18,74 24,66" 
          stroke="url(#neonCyanEmerald)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#neonGlow)"/>
    <circle cx="2" cy="48" r="3.5" fill="#00F2FE"/>

    <!-- Header Text -->
    <text x="0" y="125" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="22" font-weight="900" text-anchor="middle">حسابی قفل است</text>
    <text x="0" y="150" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="13" text-anchor="middle">رمز عبور ۴ رقمی یا اثر انگشت خود را وارد کنید</text>
  </g>

  <!-- Capsule PIN Dots Indicator -->
  <g id="PinDots" transform="translate(196, 310)">
    <!-- Dot 1: Filled -->
    <rect x="-60" y="-8" width="16" height="16" rx="8" fill="url(#neonCyanEmerald)" filter="url(#neonGlow)"/>
    <!-- Dot 2: Filled -->
    <rect x="-24" y="-8" width="16" height="16" rx="8" fill="url(#neonCyanEmerald)" filter="url(#neonGlow)"/>
    <!-- Dot 3: Empty -->
    <rect x="12" y="-8" width="16" height="16" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <!-- Dot 4: Empty -->
    <rect x="48" y="-8" width="16" height="16" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- Lumina Obsidian Glass Keypad -->
  <g id="Keypad" transform="translate(48, 380)">
    <!-- Row 1: 1, 2, 3 -->
    <g transform="translate(0, 0)">
      <circle cx="36" cy="36" r="36" fill="url(#keypadGrad)" stroke="#334155" stroke-width="1"/>
      <text x="36" y="44" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="22" font-weight="700" text-anchor="middle">۱</text>

      <circle cx="148" cy="36" r="36" fill="url(#keypadGrad)" stroke="#334155" stroke-width="1"/>
      <text x="148" y="44" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="22" font-weight="700" text-anchor="middle">۲</text>

      <circle cx="260" cy="36" r="36" fill="url(#keypadGrad)" stroke="#334155" stroke-width="1"/>
      <text x="260" y="44" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="22" font-weight="700" text-anchor="middle">۳</text>
    </g>

    <!-- Row 2: 4, 5, 6 -->
    <g transform="translate(0, 92)">
      <circle cx="36" cy="36" r="36" fill="url(#keypadGrad)" stroke="#334155" stroke-width="1"/>
      <text x="36" y="44" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="22" font-weight="700" text-anchor="middle">۴</text>

      <circle cx="148" cy="36" r="36" fill="url(#keypadGrad)" stroke="#334155" stroke-width="1"/>
      <text x="148" y="44" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="22" font-weight="700" text-anchor="middle">۵</text>

      <circle cx="260" cy="36" r="36" fill="url(#keypadGrad)" stroke="#334155" stroke-width="1"/>
      <text x="260" y="44" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="22" font-weight="700" text-anchor="middle">۶</text>
    </g>

    <!-- Row 3: 7, 8, 9 -->
    <g transform="translate(0, 184)">
      <circle cx="36" cy="36" r="36" fill="url(#keypadGrad)" stroke="#334155" stroke-width="1"/>
      <text x="36" y="44" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="22" font-weight="700" text-anchor="middle">۷</text>

      <circle cx="148" cy="36" r="36" fill="url(#keypadGrad)" stroke="#334155" stroke-width="1"/>
      <text x="148" y="44" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="22" font-weight="700" text-anchor="middle">۸</text>

      <circle cx="260" cy="36" r="36" fill="url(#keypadGrad)" stroke="#334155" stroke-width="1"/>
      <text x="260" y="44" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="22" font-weight="700" text-anchor="middle">۹</text>
    </g>

    <!-- Row 4: Biometric, 0, Backspace -->
    <g transform="translate(0, 276)">
      <!-- Biometric Fingerprint Sensor Button -->
      <circle cx="36" cy="36" r="36" fill="#00F2FE" fill-opacity="0.12" stroke="#00F2FE" stroke-width="1.2" filter="url(#neonGlow)"/>
      <text x="36" y="43" font-size="24" text-anchor="middle">☝️</text>

      <!-- 0 -->
      <circle cx="148" cy="36" r="36" fill="url(#keypadGrad)" stroke="#334155" stroke-width="1"/>
      <text x="148" y="44" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="22" font-weight="700" text-anchor="middle">۰</text>

      <!-- Delete Button -->
      <circle cx="260" cy="36" r="36" fill="url(#keypadGrad)" stroke="#334155" stroke-width="1"/>
      <text x="260" y="43" fill="#94A3B8" font-size="20" text-anchor="middle">⌫</text>
    </g>
  </g>

  <!-- Offline Privacy Notice -->
  <text x="196" y="800" fill="#64748B" font-family="Vazirmatn, sans-serif" font-size="11" text-anchor="middle">🔒 حفاظت کامل آفلاین با هش نمک‌دار SHA-256</text>
</svg>
