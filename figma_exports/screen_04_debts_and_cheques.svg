<svg width="393" height="852" viewBox="0 0 393 852" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="393" y2="852" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0E17"/>
      <stop offset="100%" stop-color="#0F1422"/>
    </linearGradient>

    <linearGradient id="neonCyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="glassCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2234" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#121826" stop-opacity="0.65"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="393" height="852" fill="url(#bgGrad)"/>

  <!-- Top App Bar -->
  <g id="TopBar" transform="translate(20, 50)">
    <circle cx="20" cy="20" r="18" fill="#1E293B"/>
    <text x="20" y="24" fill="#94A3B8" font-size="14" text-anchor="middle">←</text>
    <text x="353" y="18" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="12" text-anchor="end">دفترچه تعهدات</text>
    <text x="353" y="38" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="18" font-weight="800" text-anchor="end">چک‌ها، وام‌ها و طلب/بدهی</text>
  </g>

  <!-- Segmented Tabs (3 Tabs) -->
  <g id="SegmentedTabs" transform="translate(20, 105)">
    <rect width="353" height="46" rx="14" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Tab 2: Cheques (Active) -->
    <rect x="119" y="4" width="115" height="38" rx="10" fill="#1E293B"/>
    <text x="176" y="28" fill="#00F2FE" font-family="Vazirmatn, sans-serif" font-size="13" font-weight="800" text-anchor="middle">چک‌های صیادی</text>

    <!-- Tab 1: People & Debts -->
    <text x="296" y="28" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="13" font-weight="600" text-anchor="middle">اشخاص و طلب</text>

    <!-- Tab 3: Loans -->
    <text x="58" y="28" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="13" font-weight="600" text-anchor="middle">وام‌ها و اقساط</text>
  </g>

  <!-- Summary Total Cheques Overview Card -->
  <g id="ChequesSummaryCard" transform="translate(20, 165)">
    <rect width="353" height="110" rx="20" fill="url(#glassCardGrad)" stroke="#334155" stroke-width="1"/>

    <text x="329" y="34" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="12" text-anchor="end">تراز چک‌های در جریان</text>
    <text x="329" y="68" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="24" font-weight="900" text-anchor="end">۳۸,۰۰۰,۰۰۰ <tspan font-size="13" fill="#00F2FE">تومان</tspan></text>

    <line x1="24" y1="80" x2="329" y2="80" stroke="#334155" stroke-opacity="0.4"/>
    <text x="329" y="98" fill="#10B981" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="700" text-anchor="end">دریافتی: ۲ فقره (۵۰ میلیون)</text>
    <text x="24" y="98" fill="#F43F5E" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="700">صادره: ۱ فقره (۱۲ میلیون)</text>
  </g>

  <!-- Cheques List -->
  <g id="ChequesList" transform="translate(20, 290)">
    <Row>
      <text x="353" y="16" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="15" font-weight="800" text-anchor="end">چک‌های نزدیک به سررسید</text>
      <text x="0" y="16" fill="#00F2FE" font-family="Vazirmatn, sans-serif" font-size="12" font-weight="600">+ چک جدید</text>
    </Row>

    <!-- Cheque 1: Received from Company -->
    <g transform="translate(0, 32)">
      <rect width="353" height="130" rx="20" fill="url(#glassCardGrad)" stroke="#334155" stroke-width="1"/>
      
      <!-- Direction Badge: Received -->
      <rect x="253" y="16" width="80" height="24" rx="8" fill="#10B981" fill-opacity="0.15"/>
      <text x="293" y="32" fill="#10B981" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="700" text-anchor="middle">چک دریافتی</text>

      <!-- Status Badge: Pending -->
      <rect x="175" y="16" width="70" height="24" rx="8" fill="#F59E0B" fill-opacity="0.15"/>
      <text x="210" y="32" fill="#FBBF24" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="700" text-anchor="middle">در جریان</text>

      <!-- Bank Name & Amount -->
      <text x="329" y="68" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="15" font-weight="800" text-anchor="end">بانک صادرات ایران</text>
      <text x="24" y="68" fill="#10B981" font-family="Vazirmatn, sans-serif" font-size="17" font-weight="900">۳۵,۰۰۰,۰۰۰ <tspan font-size="11">تومان</tspan></text>

      <!-- Sayad ID Bar -->
      <rect x="24" y="82" width="305" height="32" rx="8" fill="#141C2E"/>
      <text x="315" y="103" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="11" text-anchor="end">صیاد: ۱۸۹۴-۷۳۶۲-۹۰۸۱-۲۲</text>
      <text x="36" y="103" fill="#00F2FE" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="700">سررسید: ۲۸ آبان</text>
    </g>

    <!-- Cheque 2: Issued for House Rent -->
    <g transform="translate(0, 178)">
      <rect width="353" height="130" rx="20" fill="url(#glassCardGrad)" stroke="#334155" stroke-width="1"/>
      
      <!-- Direction Badge: Issued -->
      <rect x="253" y="16" width="80" height="24" rx="8" fill="#F43F5E" fill-opacity="0.15"/>
      <text x="293" y="32" fill="#F43F5E" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="700" text-anchor="middle">چک صادره</text>

      <!-- Status Badge -->
      <rect x="175" y="16" width="70" height="24" rx="8" fill="#F59E0B" fill-opacity="0.15"/>
      <text x="210" y="32" fill="#FBBF24" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="700" text-anchor="middle">در جریان</text>

      <!-- Bank Name & Amount -->
      <text x="329" y="68" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="15" font-weight="800" text-anchor="end">بانک ملت (بابت رهن خانه)</text>
      <text x="24" y="68" fill="#F43F5E" font-family="Vazirmatn, sans-serif" font-size="17" font-weight="900">-۱۲,۰۰۰,۰۰۰ <tspan font-size="11">تومان</tspan></text>

      <!-- Sayad ID Bar -->
      <rect x="24" y="82" width="305" height="32" rx="8" fill="#141C2E"/>
      <text x="315" y="103" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="11" text-anchor="end">صیاد: ۳۴۹۸-۰۱۲۲-۵۴۱۱-۹۸</text>
      <text x="36" y="103" fill="#F59E0B" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="700">سررسید: ۵ آذر</text>
    </g>

    <!-- Loan Mini Card Snapshot -->
    <g transform="translate(0, 324)">
      <rect width="353" height="90" rx="18" fill="#141C2E" stroke="#1E293B" stroke-width="1"/>
      <text x="329" y="30" fill="#FFFFFF" font-family="Vazirmatn, sans-serif" font-size="14" font-weight="700" text-anchor="end">وام مسکن ملی (قسط ۶ از ۳۶)</text>
      <text x="24" y="30" fill="#E2E8F0" font-family="Vazirmatn, sans-serif" font-size="13" font-weight="800">مبلغ قسط: ۴,۵۰۰,۰۰۰ تومان</text>
      
      <!-- Progress Bar -->
      <rect x="24" y="52" width="305" height="6" rx="3" fill="#1E293B"/>
      <rect x="254" y="52" width="75" height="6" rx="3" fill="#00F2FE"/>
      <text x="329" y="74" fill="#94A3B8" font-family="Vazirmatn, sans-serif" font-size="11" text-anchor="end">سررسید قسط بعدی: ۱ آذر</text>
      <text x="24" y="74" fill="#00F2FE" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="700">ثبت پرداخت قسط ✓</text>
    </g>
  </g>
</svg>
